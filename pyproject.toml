[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semanticlint"
version = "0.1.0"
description = "Check finite agent-instruction models for conflicting requirements"
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py>=3,<5",
    "openai>=2,<4",
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
    "z3-solver>=4.12,<5",
]

[project.scripts]
semanticlint = "semanticlint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
demo = [
    "mcp>=2,<3",
]
